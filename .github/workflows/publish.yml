name: publish

# Publishing is a deliberate act: cut a GitHub release, or run this workflow by
# hand. The version in package.json is what gets published, so bump it in the
# commit the release points at.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # npm provenance: the workflow exchanges this for a signed attestation that
  # ties the tarball to this repository and commit.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      # lib/ is git-ignored, so the tarball's copy comes from the prepack hook.
      # --provenance needs id-token: write above; --access public covers a scoped
      # name if the package is ever renamed into one.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
